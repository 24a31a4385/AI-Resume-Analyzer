<script>
function analyze() {
    let text = document.getElementById("resume").value;
    let lower = text.toLowerCase();

    // Score initialization
    let score = 0;

    // Skills detection
    let skillsList = ["python","java","c++","ai","machine learning","sql","html","css","javascript"];
    let foundSkills = skillsList.filter(skill => lower.includes(skill));
    document.getElementById("skills").innerText = foundSkills.length ? foundSkills.join(", ") : "No skills detected";
    
    if (foundSkills.length >= 3) score += 20;  // Skill weight

    // Section detection function
    function has(words) {
        return words.some(w => lower.includes(w));
    }

    // Education
    if (has(["education","b.tech","degree"])) {
        document.getElementById("education").innerText = "Education details found";
        score += 20;
    } else {
        document.getElementById("education").innerText = "Not mentioned";
    }

    // Projects
    if (has(["project"])) {
        document.getElementById("projects").innerText = "Projects found";
        score += 20;
    } else {
        document.getElementById("projects").innerText = "Not mentioned";
    }

    // Experience
    if (has(["experience","intern"])) {
        document.getElementById("experience").innerText = "Experience found";
        score += 20;
    } else {
        document.getElementById("experience").innerText = "Not mentioned";
    }

    // Interests
    if (has(["interest","hobby"])) {
        document.getElementById("interests").innerText = "Interests found";
        score += 20;
    } else {
        document.getElementById("interests").innerText = "Not mentioned";
    }

    // Display score
    document.getElementById("score").innerText = score + " / 100";
    document.getElementById("progressBar").style.width = score + "%";

    // Suggestions
    let suggestions = [];
    if (!lower.includes("python")) suggestions.push("👉 Add Python");
    if (!has(["project"])) suggestions.push("👉 Add projects");
    if (!has(["experience","intern"])) suggestions.push("👉 Add experience");
    if (!has(["education"])) suggestions.push("👉 Add education");
    if (!has(["interest"])) suggestions.push("👉 Add interests");

    document.getElementById("suggestions").innerText = suggestions.length ? suggestions.join("\n") : "Great Resume ✅";
}
</script>
