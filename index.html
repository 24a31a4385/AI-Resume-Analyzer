<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Analyzer</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 30px;
            background: #f5f5f5;
        }
        textarea {
            width: 80%;
            height: 150px;
            padding: 10px;
        }
        button {
            padding: 10px 20px;
            margin-top: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
        .box {
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        h3 {
            color: #333;
        }
    </style>
</head>
<body>

    <h1>AI Resume Analyzer 🚀</h1>

    <textarea id="resume" placeholder="Paste your resume here..."></textarea><br>
    <button onclick="analyze()">Analyze</button>

    <div class="box">
        <h3>Skills Found:</h3>
        <p id="skills"></p>

        <h3>Education:</h3>
        <p id="education" style="white-space: pre-line;"></p>

        <h3>Projects:</h3>
        <p id="projects" style="white-space: pre-line;"></p>

        <h3>Experience:</h3>
        <p id="experience" style="white-space: pre-line;"></p>

        <h3>Interests:</h3>
        <p id="interests" style="white-space: pre-line;"></p>

        <h3>Suggestions:</h3>
        <p id="suggestions" style="white-space: pre-line; color: red;"></p>
    </div>

    <script>
        function analyze() {
            let text = document.getElementById("resume").value;
            let lowerText = text.toLowerCase();

            // Skills
            let skills = ["python", "java", "c++", "ai", "machine learning", "sql", "html", "css", "javascript"];
            let foundSkills = skills.filter(skill => lowerText.includes(skill));
            document.getElementById("skills").innerText = foundSkills.join(", ") || "No skills detected";

            // Extract sections
            function extractSection(keyword) {
                let index = lowerText.indexOf(keyword);
                if (index === -1) return "Not mentioned";
                return text.substring(index, index + 200);
            }

            let education = extractSection("education");
            let projects = extractSection("project");
            let experience = extractSection("experience");
            let interests = extractSection("interest");

            document.getElementById("education").innerText = education;
            document.getElementById("projects").innerText = projects;
            document.getElementById("experience").innerText = experience;
            document.getElementById("interests").innerText = interests;

            // Suggestions
            let suggestions = [];

            if (!lowerText.includes("python")) suggestions.push("👉 Add Python skill");
            if (!lowerText.includes("machine learning") && !lowerText.includes("ai")) {
                suggestions.push("👉 Add AI or Machine Learning projects");
            }
            if (!lowerText.includes("project")) suggestions.push("👉 Add projects");
            if (!lowerText.includes("experience")) suggestions.push("👉 Add experience");
            if (!lowerText.includes("education")) suggestions.push("👉 Add education details");
            if (!lowerText.includes("interest")) suggestions.push("👉 Add interests section");
            if (!lowerText.includes("communication")) suggestions.push("👉 Add communication skills");
            if (text.length < 200) suggestions.push("👉 Resume is too short, add more details");

            document.getElementById("suggestions").innerText =
                suggestions.join("\n") || "✅ Great resume!";
        }
    </script>

</body>
</html>
