<script>
function analyze() {
    let text = document.getElementById("resume").value;
    let lowerText = text.toLowerCase();

    // Skills detection
    let skills = ["python", "java", "c++", "ai", "machine learning", "sql", "html", "css", "javascript"];
    let foundSkills = skills.filter(skill => lowerText.includes(skill));

    document.getElementById("skills").innerText =
        foundSkills.length > 0 ? foundSkills.join(", ") : "No skills detected";

    // Better section extraction
    function extractSection(keywordList) {
        for (let keyword of keywordList) {
            let index = lowerText.indexOf(keyword);
            if (index !== -1) {
                return text.substring(index, index + 300);
            }
        }
        return "Not mentioned";
    }

    let education = extractSection(["education", "b.tech", "degree"]);
    let projects = extractSection(["project", "projects"]);
    let experience = extractSection(["experience", "intern", "internship"]);
    let interests = extractSection(["interest", "hobby", "hobbies"]);

    document.getElementById("education").innerText = education;
    document.getElementById("projects").innerText = projects;
    document.getElementById("experience").innerText = experience;
    document.getElementById("interests").innerText = interests;

    // Suggestions (STRONG FIX)
    let suggestions = [];

    if (!lowerText.includes("python")) suggestions.push("👉 Add Python skill");
    if (!lowerText.includes("machine learning") && !lowerText.includes("ai")) {
        suggestions.push("👉 Add AI or Machine Learning projects");
    }
    if (!lowerText.includes("project")) suggestions.push("👉 Add projects section");
    if (!lowerText.includes("experience") && !lowerText.includes("intern")) {
        suggestions.push("👉 Add experience or internship");
    }
    if (!lowerText.includes("education") && !lowerText.includes("b.tech")) {
        suggestions.push("👉 Add education details");
    }
    if (!lowerText.includes("interest") && !lowerText.includes("hobby")) {
        suggestions.push("👉 Add interests section");
    }
    if (!lowerText.includes("communication")) {
        suggestions.push("👉 Add communication skills");
    }
    if (text.trim().length < 150) {
        suggestions.push("👉 Resume is too short, add more content");
    }

    document.getElementById("suggestions").innerText =
        suggestions.length > 0 ? suggestions.join("\n") : "✅ Great resume!";
}
</script>
