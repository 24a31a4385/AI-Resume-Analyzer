<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Analyzer</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 30px; }
        textarea { width: 80%; height: 150px; }
        button { padding: 10px 20px; margin-top: 10px; }
        .box { margin-top: 20px; }
    </style>
</head>
<body>

    <h1>AI Resume Analyzer 🚀</h1>

    <textarea id="resume" placeholder="Paste your resume here..."></textarea><br>
    <button onclick="analyze()">Analyze</button>

    <div class="box">
        <h3>Skills Found:</h3>
        <p id="skills"></p>

        <h3>Suggestions:</h3>
        <p id="suggestions"></p>
    </div>

    <script>
        function analyze() {
            let text = document.getElementById("resume").value;

            let skills = ["Python", "Java", "C++", "AI", "Machine Learning"];
            let found = skills.filter(skill => text.includes(skill));

            document.getElementById("skills").innerText = found.join(", ");

            let suggestions = "";
            if (!found.includes("Python")) {
                suggestions += "Add Python skill. ";
            }
            if (!found.includes("AI")) {
                suggestions += "Add AI projects.";
            }

            document.getElementById("suggestions").innerText = suggestions;
        }
    </script>

</body>
</html>
