<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Analyzer</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 30px; }
        textarea { width: 80%; height: 150px; }
        button { padding: 10px; margin-top: 10px; }
        .box { margin-top: 20px; }
        p { white-space: pre-line; }
    </style>
</head>
<body>

<h1>AI Resume Analyzer 🚀</h1>

<textarea id="resume" placeholder="Paste your resume here..."></textarea><br>
<button onclick="analyze()">Analyze</button>

<div class="box">
    <h3>Skills:</h3>
    <p id="skills"></p>

    <h3>Education:</h3>
    <p id="education"></p>

    <h3>Projects:</h3>
    <p id="projects"></p>

    <h3>Experience:</h3>
    <p id="experience"></p>

    <h3>Interests:</h3>
    <p id="interests"></p>

    <h3>Suggestions:</h3>
    <p id="suggestions"></p>
</div>

<script>
function analyze() {
    let text = document.getElementById("resume").value;
    let lower = text.toLowerCase();

    // Skills
    let skillsList = ["python","java","c++","ai","machine learning","sql","html","css","javascript"];
    let found = skillsList.filter(s => lower.includes(s));
    document.getElementById("skills").innerText = found.length ? found.join(", ") : "No skills";

    // Sections
    function getSection(words) {
        for (let w of words) {
            let i = lower.indexOf(w);
            if (i !== -1) {
                return text.substring(i, i + 200);
            }
        }
        return "Not mentioned";
    }

    document.getElementById("education").innerText =
        getSection(["education","b.tech","degree"]);

    document.getElementById("projects").innerText =
        getSection(["project"]);

    document.getElementById("experience").innerText =
        getSection(["experience","intern"]);

    document.getElementById("interests").innerText =
        getSection(["interest","hobby"]);

    // Suggestions
    let sug = [];

    if (!lower.includes("python")) sug.push("Add Python");
    if (!lower.includes("project")) sug.push("Add projects");
    if (!lower.includes("experience") && !lower.includes("intern")) sug.push("Add experience");
    if (!lower.includes("education")) sug.push("Add education");
    if (!lower.includes("interest")) sug.push("Add interests");
    if (text.length < 150) sug.push("Resume too short");

    document.getElementById("suggestions").innerText =
        sug.length ? sug.join("\n") : "Great Resume ✅";
}
</script>

</body>
</html>
